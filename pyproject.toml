[project]
name = "order-tracking-agents"
version = "0.1.0"
description = "Async multi-agent order-tracking demo built with Google ADK and asyncio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "litellm==1.80.16",
    "google-adk>=1.0.0",
    "google-adk[a2a]==1.19.0",
    "google-genai>=1.0.0",
    "mcp==1.25.0",
    "monocle_apptrace",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
track-order = "order_tracking.async_runner:_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["order_tracking"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py310"
